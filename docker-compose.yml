# ============================================================
# ChargeLoop - Docker Compose for Local Development
# ============================================================
# Spins up Redis + MongoDB locally so you can develop with
# the full stack without external dependencies.
#
# Usage:
#   docker-compose up -d          # Start Redis + MongoDB
#   npm run dev                   # Start backend normally
#   cd frontend && npm run dev    # Start frontend normally
#
# Or run everything in containers:
#   docker-compose --profile full up -d

services:
  # ============================================================
  # Redis — Required for OTP, rate limiting, BullMQ queues
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: chargeloop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # MongoDB — Local dev database (optional, you can use Atlas)
  # ============================================================
  mongodb:
    image: mongo:7
    container_name: chargeloop-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: chargeloop
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Backend API (only with --profile full)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chargeloop-backend
    profiles: ["full"]
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongodb:27017/chargeloop
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Frontend (only with --profile full)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
    container_name: chargeloop-frontend
    profiles: ["full"]
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
